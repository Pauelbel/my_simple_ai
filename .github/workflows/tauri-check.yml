name: Tauri packages

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Tag to publish, for example v0.3.0. Leave empty for test packages."
        type: string
        required: false
  push:
    branches: ["**"]
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]
    paths: ["apps/desktop/**", "scripts/tauri-release.mjs", ".github/workflows/tauri-check.yml"]
  pull_request:
    paths: ["apps/desktop/**", "scripts/tauri-release.mjs", ".github/workflows/tauri-check.yml"]

permissions:
  contents: read

env:
  RELEASE_TAG: ${{ github.event_name == 'push' && github.ref_type == 'tag' && github.ref_name || inputs.release_tag || '' }}

jobs:
  package:
    strategy:
      matrix:
        include:
          - runner: windows-2025
            target: x86_64-pc-windows-msvc
            platform: windows-x86_64
          - runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            platform: linux-x86_64
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        working-directory: apps/desktop
        shell: bash
    env:
      TARGET: ${{ matrix.target }}
      PLATFORM: ${{ matrix.platform }}
      APPIMAGE_EXTRACT_AND_RUN: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag && format('refs/tags/{0}', inputs.release_tag) || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
          key: ${{ matrix.target }}
          cache-workspace-crates: "false"
          cache-bin: "false"
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/master' }}
      - name: System libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev libdbus-1-dev librsvg2-dev libfuse2 patchelf xdg-utils
      - run: npm ci
      - run: npm run check
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml --check
      - run: cargo test --manifest-path src-tauri/Cargo.toml --target "$TARGET" --locked
      - name: Configure signed release
        if: env.RELEASE_TAG != ''
        env:
          TAURI_UPDATER_PUBLIC_KEY: ${{ vars.TAURI_UPDATER_PUBLIC_KEY }}
        run: node ../../scripts/tauri-release.mjs prepare
      - name: Build test package
        if: env.RELEASE_TAG == ''
        run: npm run tauri -- build --ci --target "$TARGET" -- --locked
      - name: Build signed package
        if: env.RELEASE_TAG != ''
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          test -n "$TAURI_SIGNING_PRIVATE_KEY" || { echo "Missing TAURI_SIGNING_PRIVATE_KEY"; exit 1; }
          npm run tauri -- build --ci --target "$TARGET" --config "$RUNNER_TEMP/tauri-release.json" -- --locked
      - run: node ../../scripts/tauri-release.mjs stage
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}
          path: apps/desktop/release-packages/*
          if-no-files-found: error

  publish:
    if: (github.event_name == 'push' && github.ref_type == 'tag') || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
    needs: package
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    concurrency:
      group: publish-tauri-release
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag && format('refs/tags/{0}', inputs.release_tag) || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          path: release-packages
      - run: node scripts/tauri-release.mjs manifest
      - name: Give installers stable download names
        run: |
          node --input-type=module <<'JS'
          import { readFile, rename, writeFile } from 'node:fs/promises'
          const path = 'release-packages/latest.json'
          const manifest = JSON.parse(await readFile(path, 'utf8'))
          for (const [platform, update] of Object.entries(manifest.platforms)) {
            const url = new URL(update.url)
            const original = url.pathname.split('/').at(-1)
            const stable = original.replace(/^My-Simple-AI_\d+\.\d+\.\d+_/, 'My-Simple-AI_')
            if (stable !== original) {
              const folder = 'release-packages/' + platform + '/'
              await rename(folder + original, folder + stable)
              await rename(folder + original + '.sig', folder + stable + '.sig')
              url.pathname = url.pathname.slice(0, -original.length) + stable
              update.url = url.href
            }
          }
          await writeFile(path, JSON.stringify(manifest, null, 2) + '\n')
          JS
      - name: Publish both signed packages and the update manifest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --draft --generate-notes \
            release-packages/windows-x86_64/* release-packages/linux-x86_64/* release-packages/latest.json
          gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest

  publish_registry:
    needs: publish
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: oras-project/setup-oras@5e2f2482b30b0cb3e14e67f89a80c88c659a7c63 # v2.0.3
        with:
          version: 1.3.6
      - name: Publish release files to GitHub Packages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir registry-assets
          cd registry-assets
          windows=My-Simple-AI_windows-x86_64-setup.exe
          linux=My-Simple-AI_linux-x86_64.AppImage
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern "$windows" --pattern "$windows.sig" \
            --pattern "$linux" --pattern "$linux.sig" --pattern latest.json
          printf '%s' "$GH_TOKEN" | oras login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          oras push "ghcr.io/${GITHUB_REPOSITORY,,}:$RELEASE_TAG" \
            --artifact-type application/vnd.my-simple-ai.desktop.release.v1 \
            --annotation "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            "$windows" "$windows.sig" "$linux" "$linux.sig" latest.json
