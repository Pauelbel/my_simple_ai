[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "desktop-assistant"
version = "0.1.0"
description = "Transparent desktop assistant with Markdown notes"
requires-python = ">=3.10"
dependencies = ["PySide6>=6.6,<7", "faster-whisper==1.2.1", "av>=12,<19"]

[project.optional-dependencies]
build = ["pyinstaller>=6.0"]
test = ["pytest>=8"]

[project.scripts]
desktop-assistant = "desktop_assistant.__main__:main"

[tool.setuptools]
packages = ["desktop_assistant", "desktop_assistant.services"]

[tool.setuptools.package-data]
desktop_assistant = ["qml/*.qml", "qml/notes/*.qml", "qml/notes/qmldir", "assets/*.png", "assets/*.ico", "assets/*.wav"]
